name: hermes_ios
description: "Native iOS app for Hermes Agent -- chat, sessions, skills, and more."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.2
  http: ^1.3.0
  flutter_markdown: ^0.7.7
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/