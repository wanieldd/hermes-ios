name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --no-codesign --release
        env:
          CI: true

      - name: Package IPA
        run: |
          # Find the built .app bundle
          APP_PATH=$(find build/ios -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"

          # Create the IPA structure (Payload/<AppName>.app)
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/

          # Zip into IPA
          cd artifacts
          zip -r hermes-ios-unsigned.ipa Payload
          cd ..

          # Verify
          ls -lh artifacts/hermes-ios-unsigned.ipa
          unzip -l artifacts/hermes-ios-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-unsigned-${{ github.sha }}
          path: artifacts/hermes-ios-unsigned.ipa
          retention-days: 7

      - name: Verify IPA
        run: |
          ls -lh artifacts/hermes-ios-unsigned.ipa